    Projects:
      - name: LogiMind
        summary: Multi-agent RAG over public logistics operational documentation. Fixed-orchestration agent pipeline (planner, retriever, responder) with hybrid BM25 and dense retrieval, Qdrant, FastAPI, Streamlit. 0.98 faithfulness, ~9.4s median latency, $0.028 per query. 108 tests, Dockerized, CI on every push, deployed live.
