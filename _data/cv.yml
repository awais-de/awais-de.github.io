      - name: Neural Audio Codec (audio_cod)
        summary: Low-latency neural speech codec research for my M.Sc. thesis. Causal transformer encoder/decoder with residual vector quantisation, targeting 8-16 kbps for real-time speech. Eight-phase controlled curriculum; quality plateaued at 3 bits per codebook.
        highlights:
          - Python, PyTorch, torchaudio

      - name: edc_pred
        summary: Predicting energy decay curves from room geometry. 103M-parameter model reaching R² = 0.9995 on T20 and C50 prediction, trained on measured spatial room impulse responses.
        highlights:
          - Python, PyTorch

      - name: SRIR-Analysis
        summary: Comparative study of PCA, LDA, and EFA for room acoustics classification. Parameter sensitivity analysis across octave bands on the Stolz et al. (2024) SRIR dataset.
        highlights:
          - MATLAB

      - name: Job Application Tracker
        summary: Self-built application tracker with AI-powered intake. React front end, Supabase backend, Claude API for parsing job postings.
        highlights:
          - React, Supabase, Claude API
